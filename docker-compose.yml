services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:-botpassword}@postgres:5432/${POSTGRES_DB:-instagram_bot}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - botnet
    expose:
      - "8000"
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:-botpassword}@postgres:5432/${POSTGRES_DB:-instagram_bot}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --queues=messages,maintenance
      --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - botnet

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:-botpassword}@postgres:5432/${POSTGRES_DB:-instagram_bot}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
    command: >
      celery -A app.celery_app beat
      --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - botnet

  telegram-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:-botpassword}@postgres:5432/${POSTGRES_DB:-instagram_bot}
      - REDIS_URL=redis://redis:6379/0
    command: python -m app.bot_runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - botnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - botnet

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botpassword}
      POSTGRES_DB: ${POSTGRES_DB:-instagram_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - botnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botuser} -d ${POSTGRES_DB:-instagram_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - botnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - letsencrypt_data:/etc/letsencrypt
    # Generate self-signed certs if real Let's Encrypt certs are absent (local dev)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null 2>&1 || true
        LE=/etc/letsencrypt
        DOMAIN=beekeeper.uz
        mkdir -p $$LE/live/$$DOMAIN
        if [ ! -f $$LE/options-ssl-nginx.conf ]; then
          printf 'ssl_protocols TLSv1.2 TLSv1.3;\nssl_prefer_server_ciphers off;\n' > $$LE/options-ssl-nginx.conf
        fi
        if [ ! -f $$LE/live/$$DOMAIN/fullchain.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -keyout $$LE/live/$$DOMAIN/privkey.pem -out $$LE/live/$$DOMAIN/fullchain.pem -subj "/CN=$$DOMAIN" 2>/dev/null
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - app
      - frontend
    networks:
      - botnet

volumes:
  postgres_data:
  redis_data:
  letsencrypt_data:

networks:
  botnet:
    driver: bridge

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Use Docker's internal DNS so nginx re-resolves upstream IPs after
    # container restarts (prevents 502 from stale cached IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP reverse proxy for local development
    # ACME challenge and HTTP proxy for beekeeper.uz
    server {
        listen 80;
        server_name beekeeper.uz www.beekeeper.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        client_max_body_size 10M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Webhook endpoint - stricter rate limit
        location /api/v1/webhook/ {
            limit_req zone=webhook_limit burst=200 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Admin API
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs
        location /docs {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://app:8000;
        }

        # Frontend dashboard (production nginx container on port 80)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server for beekeeper.uz (uses obtained certificates)
    server {
        listen 443 ssl;
        server_name beekeeper.uz www.beekeeper.uz;

        ssl_certificate /etc/letsencrypt/live/beekeeper.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beekeeper.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 10M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Webhook endpoint - stricter rate limit
        location /api/v1/webhook/ {
            limit_req zone=webhook_limit burst=200 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Admin API
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs
        location /docs {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://app:8000;
        }

        # Frontend dashboard (production nginx container on port 80)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP reverse proxy for local development (fallback)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        client_max_body_size 10M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Webhook endpoint - stricter rate limit
        location /api/v1/webhook/ {
            limit_req zone=webhook_limit burst=200 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Disable buffering so the raw body reaches FastAPI unmodified
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Admin API
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs
        location /docs {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://app:8000;
        }

        # Frontend dashboard (production nginx container on port 80)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
